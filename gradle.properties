org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=true
# GHSA-r937-wjx7-w2jp (CVE-2026-53914): unsafe deserialization in the
# Kotlin build cache, affects kotlin-gradle-plugin < 2.4.20-Beta1. C264
# moved the pin to 2.4.10, which is still inside that range, so the cache
# stays off. 2.4.20 was at RC3 on 2026-09-04 and shipping an RC compiler
# to get a mitigation that is already in place is not a trade worth
# making. Turn this back on when 2.4.20 is released and pinned. The
# configuration cache below is a different feature and is not affected.
org.gradle.caching=false
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g

android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true
