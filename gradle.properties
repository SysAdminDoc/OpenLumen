org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Read by the screenshot plugin when it is applied, so it cannot move into
# the module's experimentalProperties.
android.experimental.enableScreenshotTest=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.compose.screenshot.maxHeapSize=4g

android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true
