org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseSerialGC
org.gradle.parallel=true
# GHSA-r937-wjx7-w2jp (CVE-2026-53914): unsafe deserialization in the
# Kotlin build cache, affects kotlin-gradle-plugin < 2.4.20-Beta1, which
# covers the 2.3.21 pinned in gradle/libs.versions.toml. The advisory is
# only reachable through the build cache, so the cache stays off until
# C264 moves the plugin to 2.4.20. The configuration cache below is a
# different feature and is not affected.
org.gradle.caching=false
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g

android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true
