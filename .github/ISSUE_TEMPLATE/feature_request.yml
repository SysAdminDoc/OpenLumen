name: Feature request
description: Suggest a new feature or change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two things worth checking first:

        - The [feature list](https://github.com/SysAdminDoc/OpenLumen#features)
          in the README, in case it is already there under another name.
        - [docs/deferred-candidates.md](https://github.com/SysAdminDoc/OpenLumen/blob/main/docs/deferred-candidates.md),
          which records the things that were considered and parked, and why.

        The working roadmap is not published, so there is no row to link to.
        Describe what you want and what you would do with it.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the user-side problem, not the implementation. "I can't do X" is
        better than "you should add Y".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would the app do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Existing workarounds, other apps that solve this, things that didn't work.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check (please be honest — these are veto criteria)
      options:
        - label: This doesn't require an `INTERNET` permission.
          required: true
        - label: This doesn't pull in Google Play Services or other non-F-Droid-clean dependencies.
          required: true
        - label: This isn't a health/medical claim (see `docs/health-evidence.md`).
          required: true
        - label: This isn't ads, paywall, account login, or cloud sync.
          required: true
