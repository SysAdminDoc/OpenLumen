# Baseline: gitleaks' own default rules, then the two things in this repo that
# they read as secrets and are not. Without these the gate exits 1 on 46 false
# positives, which teaches people to ignore it.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets in this repository"

paths = [
  # Gradle dependency verification. The long hex strings are SHA-256 artifact
  # checksums and PGP key fingerprints, both public by design: they are what
  # you publish so other people can check you. generic-api-key matches them on
  # entropy alone.
  '''gradle/verification-metadata.*\.xml''',
]

commits = [
  # A roadmap line whose wrapped prose reads as high entropy. ROADMAP.md is
  # untracked now, so this only ever comes up on a history scan.
  "8db400ca61b51dc98a2d940fb120cdc46fdcebe6",
]
